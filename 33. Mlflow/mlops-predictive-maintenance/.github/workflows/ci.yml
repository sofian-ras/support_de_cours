name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests & Qualite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlops-predictive-maintenance/requirements.txt

      - name: Run tests with coverage >= 70%
        working-directory: mlops-predictive-maintenance
        run: pytest --cov=src --cov=api --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/predictive-maintenance-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./mlops-predictive-maintenance
          file: ./mlops-predictive-maintenance/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r mlops-predictive-maintenance/requirements.txt

  smoke:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image (local)
        run: docker build -t predictive-maintenance-api:ci ./mlops-predictive-maintenance

      - name: Start API container
        run: |
          docker run -d --name pm-api -p 8000:8000 predictive-maintenance-api:ci
          sleep 8

      - name: Check /health
        run: |
          curl --fail http://localhost:8000/health

      - name: Cleanup
        if: always()
        run: docker rm -f pm-api
