version: "3.9"

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data:
    driver: local

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --serve-artifacts
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-trainer
    command: python src/train.py
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=predictive-maintenance-model
      - MODEL_STAGE=latest
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped
